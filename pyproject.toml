[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelloom"
version = "0.1.0"
description = "Рисование пиксель-арта кодом с живым просмотром в браузере"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "THET1ME-1" }]
keywords = ["pixel-art", "sprites", "gamedev", "live-preview", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.urls]
Home = "https://github.com/THET1ME-1/pixelloom"
Issues = "https://github.com/THET1ME-1/pixelloom/issues"

[project.scripts]
pixelloom = "pixelloom.demo:main"

[tool.setuptools.packages.find]
include = ["pixelloom*"]

[tool.setuptools.package-data]
pixelloom = ["live/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
